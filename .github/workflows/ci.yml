name: CI

# Gate every push/PR: lint + format + typecheck + tests + build for client and
# server, AI-service compile + tests.
# Mirrors the local checks (docs/06 Phase 1) so regressions fail before merge.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  client:
    name: Client (lint + format + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # >= 22: `npm test` passes a glob to `node --test`.
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npm run format:check
        working-directory: client
      # Editor logic and components (Vitest + jsdom; the API is faked with MSW),
      # with the coverage floors in vitest.config.js.
      - run: npm run test:coverage
        working-directory: client
      # `build` runs `tsc --noEmit && vite build`, so this covers typecheck too.
      - run: npm run build
        working-directory: client

  server:
    name: Server (typecheck + lint + format + tests)
    runs-on: ubuntu-latest
    # Integration tests wipe the shared test database: never run two at once.
    concurrency:
      group: server-test-database
      cancel-in-progress: false
    env:
      # Repository secret: the Neon *test* branch (never production). When it's
      # not set (e.g. on a fork), only the unit tests run.
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      # postinstall runs `prisma generate` (needs the schema, not a live DB),
      # producing the @prisma/client types the typecheck depends on.
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm run lint
        working-directory: server
      - run: npm run format:check
        working-directory: server
      # Unit tests: no database, no network.
      - name: Unit tests
        if: env.TEST_DATABASE_URL == ''
        run: npm run test:unit
        working-directory: server
      # Unit + integration (the API over HTTP against the test database), with
      # the coverage floors in vitest.config.mts.
      - name: All tests + coverage
        if: env.TEST_DATABASE_URL != ''
        run: npm run test:coverage
        working-directory: server

  ai-service:
    name: AI service (compile + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.24"
      # Python version comes from .python-version; --frozen fails if uv.lock is stale.
      # Note: this installs CUDA torch (several GB); CI runs it on CPU.
      - run: uv sync --frozen
        working-directory: Ai-service
      # Byte-compile all modules: catches syntax errors deterministically
      # without needing the runtime env/config the app expects at import.
      - run: uv run python -m compileall app
        working-directory: Ai-service
      # Vectorization + service behaviour; needs no model weights.
      - run: uv run pytest -q
        working-directory: Ai-service
