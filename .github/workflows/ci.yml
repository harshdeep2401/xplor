name: CI

# Gate every push/PR: client build, server typecheck, AI-service compile.
# Mirrors the local checks (docs/06 Phase 1) so regressions fail before merge.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  client:
    name: Client (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      # `build` runs `tsc --noEmit && vite build`, so this covers typecheck too.
      - run: npm run build
        working-directory: client

  server:
    name: Server (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json
      # postinstall runs `prisma generate` (needs the schema, not a live DB),
      # producing the @prisma/client types the typecheck depends on.
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      # Converter unit tests are pure (no DB/env) — safe to run in CI.
      - run: npm test
        working-directory: server

  ai-service:
    name: AI service (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.21"
      # Python version comes from .python-version; --frozen fails if uv.lock is stale.
      - run: uv sync --frozen
        working-directory: Ai-service
      # Byte-compile all modules: catches syntax errors deterministically
      # without needing the runtime env/config the app expects at import.
      - run: uv run python -m compileall app
        working-directory: Ai-service
